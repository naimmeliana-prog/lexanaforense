name: CI/CD · LexMedica Enfermería Forense (GitHub + Vercel)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  quality-and-unit-tests:
    name: Verificación TypeScript, Pruebas Unitarias y Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Análisis estático de tipos (TypeScript Lint)
        run: npm run lint

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Compilar aplicación para producción (Vite Build)
        run: npm run build

      - name: Subir artefacto de producción
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/

  deploy-vercel:
    name: Despliegue Automático en Vercel
    needs: quality-and-unit-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Desplegar en Vercel (si VERCEL_TOKEN está configurado en GitHub Secrets)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx vercel build --prod --token="$VERCEL_TOKEN"
            npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
          else
            echo "Integración nativa GitHub-Vercel activa o secrets pendientes de configurar."
          fi
